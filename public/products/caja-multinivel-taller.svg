<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="workshopBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F1F5F9"/>
      <stop offset="60%" stopColor="#E2E8F0"/>
      <stop offset="100%" stopColor="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="whiteTray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="70%" stopColor="#F8FAFC"/>
      <stop offset="100%" stopColor="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="tealTray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22D3EE"/>
      <stop offset="50%" stopColor="#06B6D4"/>
      <stop offset="100%" stopColor="#0891B2"/>
    </linearGradient>
    <linearGradient id="tealArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22D3EE"/>
      <stop offset="100%" stopColor="#0E7490"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" floodColor="#0F172A" floodOpacity="0.22"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#workshopBg)"/>

  <!-- Workshop Mat & Shadow -->
  <polygon points="40,500 560,500 590,600 10,600" fill="#334155" opacity="0.3"/>
  <ellipse cx="300" cy="510" rx="200" ry="25" fill="#0F172A" opacity="0.35"/>

  <!-- Multi-tier Cantilever 3D Printed Organizer -->
  <g transform="translate(100, 60)" filter="url(#boxShadow)">
    
    <!-- Vertical Pink Support Post on left -->
    <rect x="25" y="100" width="16" height="340" rx="8" fill="#EC4899" stroke="#DB2777" strokeWidth="2"/>

    <!-- TIER 1 (Top Level) -->
    <g transform="translate(45, 10)">
      <!-- White outer housing frame -->
      <path d="M0,0 L320,0 L305,80 L0,80 Z" fill="url(#whiteTray)" stroke="#CBD5E1" strokeWidth="2"/>
      <!-- Inner teal bins (divided compartments) -->
      <polygon points="12,8 70,8 65,72 12,72" fill="url(#tealTray)"/>
      <polygon points="76,8 135,8 130,72 71,72" fill="url(#tealTray)"/>
      <polygon points="141,8 200,8 195,72 136,72" fill="url(#tealTray)"/>
      <polygon points="206,8 265,8 260,72 201,72" fill="url(#tealTray)"/>
      <polygon points="271,8 310,8 298,72 266,72" fill="url(#tealTray)"/>
    </g>

    <!-- TIER 2 (Second Level) -->
    <g transform="translate(45, 105)">
      <path d="M0,0 L320,0 L305,80 L0,80 Z" fill="url(#whiteTray)" stroke="#CBD5E1" strokeWidth="2"/>
      <polygon points="12,8 70,8 65,72 12,72" fill="url(#tealTray)"/>
      <polygon points="76,8 135,8 130,72 71,72" fill="url(#tealTray)"/>
      <polygon points="141,8 200,8 195,72 136,72" fill="url(#tealTray)"/>
      <polygon points="206,8 265,8 260,72 201,72" fill="url(#tealTray)"/>
      <polygon points="271,8 310,8 298,72 266,72" fill="url(#tealTray)"/>
    </g>

    <!-- TIER 3 (Third Level) -->
    <g transform="translate(45, 200)">
      <path d="M0,0 L320,0 L305,80 L0,80 Z" fill="url(#whiteTray)" stroke="#CBD5E1" strokeWidth="2"/>
      <polygon points="12,8 70,8 65,72 12,72" fill="url(#tealTray)"/>
      <polygon points="76,8 135,8 130,72 71,72" fill="url(#tealTray)"/>
      <polygon points="141,8 200,8 195,72 136,72" fill="url(#tealTray)"/>
      <polygon points="206,8 265,8 260,72 201,72" fill="url(#tealTray)"/>
      <polygon points="271,8 310,8 298,72 266,72" fill="url(#tealTray)"/>
    </g>

    <!-- TIER 4 (Bottom Base Level) -->
    <g transform="translate(45, 295)">
      <path d="M0,0 L320,0 L305,85 L0,85 Z" fill="url(#whiteTray)" stroke="#CBD5E1" strokeWidth="2"/>
      <polygon points="12,8 70,8 65,77 12,77" fill="url(#tealTray)"/>
      <polygon points="76,8 135,8 130,77 71,77" fill="url(#tealTray)"/>
      <polygon points="141,8 200,8 195,77 136,77" fill="url(#tealTray)"/>
      <polygon points="206,8 265,8 260,77 201,77" fill="url(#tealTray)"/>
      <polygon points="271,8 310,8 298,77 266,77" fill="url(#tealTray)"/>
    </g>

    <!-- CANTILEVER LINKAGE ARMS IN TURQUOISE WITH PINK SCREW RIVETS -->
    <!-- Arm Link 1 (Top to Tier 2) -->
    <g transform="translate(50, 45) rotate(58)">
      <rect x="0" y="-8" width="105" height="16" rx="8" fill="url(#tealArm)" stroke="#0891B2" strokeWidth="1.5"/>
      <!-- Pink screw pins on each end -->
      <circle cx="8" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="8" cy="0" r="2" fill="#FFF"/>
      <circle cx="97" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="97" cy="0" r="2" fill="#FFF"/>
    </g>

    <!-- Arm Link 1B (Parallel) -->
    <g transform="translate(85, 45) rotate(58)">
      <rect x="0" y="-8" width="105" height="16" rx="8" fill="url(#tealArm)" stroke="#0891B2" strokeWidth="1.5"/>
      <circle cx="8" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="8" cy="0" r="2" fill="#FFF"/>
      <circle cx="97" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="97" cy="0" r="2" fill="#FFF"/>
    </g>

    <!-- Arm Link 2 (Tier 2 to Tier 3) -->
    <g transform="translate(50, 140) rotate(58)">
      <rect x="0" y="-8" width="105" height="16" rx="8" fill="url(#tealArm)" stroke="#0891B2" strokeWidth="1.5"/>
      <circle cx="8" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="8" cy="0" r="2" fill="#FFF"/>
      <circle cx="97" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="97" cy="0" r="2" fill="#FFF"/>
    </g>

    <!-- Arm Link 3 (Tier 3 to Base) -->
    <g transform="translate(50, 235) rotate(58)">
      <rect x="0" y="-8" width="105" height="16" rx="8" fill="url(#tealArm)" stroke="#0891B2" strokeWidth="1.5"/>
      <circle cx="8" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="8" cy="0" r="2" fill="#FFF"/>
      <circle cx="97" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="97" cy="0" r="2" fill="#FFF"/>
    </g>

    <!-- Arm Link 4 (Tier 4 lower hinge) -->
    <g transform="translate(50, 330) rotate(58)">
      <rect x="0" y="-8" width="105" height="16" rx="8" fill="url(#tealArm)" stroke="#0891B2" strokeWidth="1.5"/>
      <circle cx="8" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="8" cy="0" r="2" fill="#FFF"/>
      <circle cx="97" cy="0" r="6" fill="#F43F5E"/>
      <circle cx="97" cy="0" r="2" fill="#FFF"/>
    </g>

  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="270" height="34" rx="17" fill="#0891B2" opacity="0.9"/>
  <text x="155" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#FFF" text-anchor="middle">🗄️ Organizador Cantilever 3D</text>
</svg>
