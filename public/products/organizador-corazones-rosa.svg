<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="warmWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFF1F2"/>
      <stop offset="60%" stopColor="#FFE4E6"/>
      <stop offset="100%" stopColor="#FECDD3"/>
    </linearGradient>
    <linearGradient id="hotPinkCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FB7185"/>
      <stop offset="30%" stopColor="#F43F5E"/>
      <stop offset="70%" stopColor="#E11D48"/>
      <stop offset="100%" stopColor="#BE123C"/>
    </linearGradient>
    <linearGradient id="heartEmboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FDA4AF"/>
      <stop offset="100%" stopColor="#E11D48"/>
    </linearGradient>
    <filter id="cupShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="4" dy="10" stdDeviation="8" floodColor="#881337" floodOpacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#warmWall)"/>

  <!-- Wall Posters in background (strawberries and cocktail art) -->
  <rect x="50" y="40" width="160" height="200" rx="8" fill="#FFF" stroke="#FDA4AF" strokeWidth="2" opacity="0.75"/>
  <circle cx="130" cy="90" r="28" fill="#FDA4AF" opacity="0.4"/>
  <text x="130" y="190" font-family="'Playfair Display', serif" font-size="12" fill="#BE123C" text-anchor="middle" font-style="italic">Sweet Berry</text>

  <rect x="390" y="40" width="160" height="200" rx="8" fill="#FFF" stroke="#FDA4AF" strokeWidth="2" opacity="0.75"/>
  <polygon points="470,120 440,75 500,75" fill="none" stroke="#FDA4AF" strokeWidth="2.5"/>
  <line x1="470" y1="120" x2="470" y2="170" stroke="#FDA4AF" strokeWidth="2.5"/>

  <!-- Soft Vanity Surface -->
  <ellipse cx="300" cy="540" rx="220" ry="30" fill="#E2E8F0" opacity="0.6"/>

  <!-- Main 3D Printed Textured Heart Cup Organizer -->
  <g transform="translate(190, 160)" filter="url(#cupShadow)">
    
    <!-- COMBS & BRUSHES COMING OUT OF THE CUP -->
    <!-- 1. Black styling comb -->
    <g transform="translate(15, -40) rotate(-15)">
      <rect x="0" y="0" width="22" height="180" rx="5" fill="#18181B"/>
      <!-- Comb teeth -->
      <line x1="22" y1="20" x2="35" y2="20" stroke="#18181B" strokeWidth="2"/>
      <line x1="22" y1="30" x2="35" y2="30" stroke="#18181B" strokeWidth="2"/>
      <line x1="22" y1="40" x2="35" y2="40" stroke="#18181B" strokeWidth="2"/>
      <line x1="22" y1="50" x2="35" y2="50" stroke="#18181B" strokeWidth="2"/>
      <line x1="22" y1="60" x2="35" y2="60" stroke="#18181B" strokeWidth="2"/>
      <line x1="22" y1="70" x2="35" y2="70" stroke="#18181B" strokeWidth="2"/>
    </g>

    <!-- 2. Red styling claw clip -->
    <g transform="translate(45, -20) rotate(-5)">
      <rect x="0" y="0" width="38" height="65" rx="8" fill="#DC2626"/>
      <circle cx="19" cy="18" r="6" fill="#FEF2F2"/>
      <circle cx="19" cy="38" r="6" fill="#FEF2F2"/>
    </g>

    <!-- 3. Round wooden barrel blow dry brush with black bristles -->
    <g transform="translate(85, -60) rotate(5)">
      <rect x="0" y="0" width="36" height="150" rx="10" fill="#78350F"/>
      <rect x="-8" y="20" width="52" height="70" rx="6" fill="#18181B"/>
    </g>

    <!-- 4. Narrow teasing comb -->
    <g transform="translate(130, -50) rotate(15)">
      <rect x="0" y="0" width="18" height="190" rx="4" fill="#881337"/>
    </g>

    <!-- THE TEXTURED 3D PRINTED CYLINDER CUP WITH EMBOSSED HEARTS -->
    <path d="M10,80 Q5,320 20,330 Q110,345 200,330 Q215,320 210,80 Z" fill="url(#hotPinkCup)"/>
    <ellipse cx="110" cy="80" rx="100" ry="24" fill="#9F1239" stroke="#E11D48" strokeWidth="3"/>
    <ellipse cx="110" cy="80" rx="90" ry="20" fill="#4C0519"/>

    <!-- 3D Heart Patterns in relief covering the cup surface (like 3D printing ridges) -->
    <!-- Row 1 -->
    <g transform="translate(40, 110)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(90, 110)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(140, 110)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 165)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(68, 165)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(118, 165)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(162, 165)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(42, 220)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(92, 220)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(142, 220)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(25, 275)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(75, 275)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
    <g transform="translate(125, 275)">
      <path d="M20,10 C10,-5 0,10 8,24 C14,35 20,44 20,44 C20,44 26,35 32,24 C40,10 30,-5 20,10 Z" fill="url(#heartEmboss)"/>
    </g>
  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="260" height="34" rx="17" fill="#BE123C" opacity="0.9"/>
  <text x="150" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#FFF" text-anchor="middle">💖 Vaso Textura Corazones</text>
</svg>
