<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="brightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="60%" stopColor="#F8FAFC"/>
      <stop offset="100%" stopColor="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="purpleOcto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D8B4FE"/>
      <stop offset="100%" stopColor="#9333EA"/>
    </linearGradient>
    <linearGradient id="greenDino" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A3E635"/>
      <stop offset="100%" stopColor="#65A30D"/>
    </linearGradient>
    <linearGradient id="pinkAxo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBCFE8"/>
      <stop offset="100%" stopColor="#EC4899"/>
    </linearGradient>
    <filter id="fidgetShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" floodColor="#000" floodOpacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#brightBg)"/>

  <!-- Top Left: Articulated Purple Octopus -->
  <g transform="translate(100, 70)" filter="url(#fidgetShadow)">
    <circle cx="80" cy="70" r="42" fill="url(#purpleOcto)"/>
    <!-- Cute Eyes -->
    <circle cx="68" cy="70" r="6" fill="#1E1B4B"/>
    <circle cx="66" cy="68" r="2" fill="#FFF"/>
    <circle cx="92" cy="70" r="6" fill="#1E1B4B"/>
    <circle cx="90" cy="68" r="2" fill="#FFF"/>
    <path d="M75,82 Q80,87 85,82" fill="none" stroke="#1E1B4B" strokeWidth="2.5" strokeLinecap="round"/>
    <!-- Flexible Tentacles with joints -->
    <circle cx="30" cy="110" r="10" fill="#A855F7"/>
    <circle cx="48" cy="122" r="10" fill="#A855F7"/>
    <circle cx="72" cy="126" r="10" fill="#A855F7"/>
    <circle cx="96" cy="124" r="10" fill="#A855F7"/>
    <circle cx="118" cy="116" r="10" fill="#A855F7"/>
    <circle cx="132" cy="100" r="10" fill="#A855F7"/>
  </g>

  <!-- Top Right: Articulated Green T-Rex Baby -->
  <g transform="translate(320, 45)" filter="url(#fidgetShadow)">
    <!-- Head -->
    <rect x="30" y="40" width="85" height="55" rx="20" fill="url(#greenDino)"/>
    <circle cx="85" cy="55" r="7" fill="#14532D"/>
    <circle cx="83" cy="53" r="2" fill="#FFF"/>
    <!-- Snout & Nostril -->
    <circle cx="45" cy="62" r="2.5" fill="#14532D"/>
    <!-- Segmented articulated spine/body -->
    <rect x="70" y="85" width="40" height="32" rx="10" fill="url(#greenDino)"/>
    <rect x="100" y="100" width="35" height="28" rx="8" fill="url(#greenDino)"/>
    <rect x="125" y="115" width="30" height="24" rx="7" fill="url(#greenDino)"/>
    <rect x="145" y="128" width="25" height="18" rx="6" fill="url(#greenDino)"/>
    <!-- Legs -->
    <rect x="80" y="115" width="18" height="30" rx="6" fill="#4D7C0F"/>
    <rect x="105" y="125" width="18" height="25" rx="6" fill="#4D7C0F"/>
  </g>

  <!-- Middle Left: Articulated Blue Snake -->
  <g transform="translate(40, 200)" filter="url(#fidgetShadow)">
    <circle cx="170" cy="120" r="18" fill="#0284C7"/>
    <circle cx="165" cy="115" r="5" fill="#082F49"/>
    <!-- Red tongue -->
    <path d="M185,125 L198,125 L204,120 M198,125 L204,130" stroke="#EF4444" strokeWidth="2.5" fill="none"/>
    <!-- Segment links alternating shades of blue -->
    <circle cx="145" cy="115" r="16" fill="#38BDF8"/>
    <circle cx="120" cy="100" r="16" fill="#0284C7"/>
    <circle cx="95" cy="85" r="16" fill="#38BDF8"/>
    <circle cx="70" cy="75" r="16" fill="#0284C7"/>
    <circle cx="50" cy="90" r="15" fill="#38BDF8"/>
    <circle cx="42" cy="115" r="14" fill="#0284C7"/>
    <circle cx="55" cy="138" r="13" fill="#38BDF8"/>
    <circle cx="78" cy="148" r="12" fill="#0284C7"/>
  </g>

  <!-- Middle Right: Articulated Pink Axolotl (Ajolote) -->
  <g transform="translate(300, 210)" filter="url(#fidgetShadow)">
    <!-- Axolotl Head -->
    <ellipse cx="65" cy="70" rx="38" ry="32" fill="url(#pinkAxo)"/>
    <circle cx="52" cy="68" r="5.5" fill="#831843"/>
    <circle cx="78" cy="68" r="5.5" fill="#831843"/>
    <path d="M60,78 Q65,83 70,78" fill="none" stroke="#831843" strokeWidth="2.5" strokeLinecap="round"/>
    <!-- Gills (Branquias plumosas rosa fuerte) -->
    <path d="M28,55 Q10,40 18,30 Q28,45 35,55" fill="#DB2777"/>
    <path d="M25,70 Q5,65 10,55 Q24,65 32,70" fill="#DB2777"/>
    <path d="M28,85 Q10,95 20,105 Q30,90 35,85" fill="#DB2777"/>
    
    <path d="M102,55 Q120,40 112,30 Q102,45 95,55" fill="#DB2777"/>
    <path d="M105,70 Q125,65 120,55 Q106,65 98,70" fill="#DB2777"/>
    <path d="M102,85 Q120,95 110,105 Q100,90 95,85" fill="#DB2777"/>
    <!-- Articulated Tail Body -->
    <rect x="95" y="60" width="30" height="24" rx="8" fill="url(#pinkAxo)"/>
    <rect x="120" y="62" width="28" height="20" rx="7" fill="url(#pinkAxo)"/>
    <rect x="144" y="65" width="25" height="16" rx="6" fill="url(#pinkAxo)"/>
    <rect x="165" y="67" width="22" height="12" rx="5" fill="url(#pinkAxo)"/>
  </g>

  <!-- Bottom Row: 4 Pastel Keychains -->
  <!-- 1. Pink Heart -->
  <g transform="translate(60, 430)" filter="url(#fidgetShadow)">
    <circle cx="35" cy="25" r="18" fill="none" stroke="#94A3B8" strokeWidth="4"/>
    <path d="M35,60 C20,45 5,60 15,80 C25,100 35,115 35,115 C35,115 45,100 55,80 C65,60 50,45 35,60 Z" fill="#FDA4AF" stroke="#F43F5E" strokeWidth="4"/>
    <path d="M35,68 C25,58 15,68 22,80 C29,92 35,102 35,102 C35,102 41,92 48,80 C55,68 45,58 35,68 Z" fill="#FB7185"/>
  </g>

  <!-- 2. Yellow Star with Face -->
  <g transform="translate(190, 430)" filter="url(#fidgetShadow)">
    <circle cx="45" cy="25" r="18" fill="none" stroke="#94A3B8" strokeWidth="4"/>
    <!-- Cute 5-point star -->
    <polygon points="45,45 55,70 82,72 61,89 68,115 45,100 22,115 29,89 8,72 35,70" fill="#FDE047" stroke="#EAB308" strokeWidth="3"/>
    <!-- Face -->
    <circle cx="38" cy="82" r="2.5" fill="#713F12"/>
    <circle cx="52" cy="82" r="2.5" fill="#713F12"/>
    <circle cx="34" cy="87" r="3" fill="#FDA4AF"/>
    <circle cx="56" cy="87" r="3" fill="#FDA4AF"/>
    <path d="M42,88 Q45,92 48,88" fill="none" stroke="#713F12" strokeWidth="1.8"/>
  </g>

  <!-- 3. Blue Cloud with Face -->
  <g transform="translate(325, 430)" filter="url(#fidgetShadow)">
    <circle cx="45" cy="25" r="18" fill="none" stroke="#94A3B8" strokeWidth="4"/>
    <!-- Cloud shape -->
    <rect x="15" y="70" width="60" height="35" rx="16" fill="#7DD3FC" stroke="#0284C7" strokeWidth="3"/>
    <circle cx="32" cy="65" r="18" fill="#7DD3FC"/>
    <circle cx="56" cy="68" r="15" fill="#7DD3FC"/>
    <!-- Face -->
    <circle cx="36" cy="84" r="2" fill="#0C4A6E"/>
    <circle cx="54" cy="84" r="2" fill="#0C4A6E"/>
    <circle cx="31" cy="88" r="3" fill="#FDA4AF"/>
    <circle cx="59" cy="88" r="3" fill="#FDA4AF"/>
    <path d="M42,90 Q45,94 48,90" fill="none" stroke="#0C4A6E" strokeWidth="1.8"/>
  </g>

  <!-- 4. Purple Cat Paw -->
  <g transform="translate(460, 430)" filter="url(#fidgetShadow)">
    <circle cx="45" cy="25" r="18" fill="none" stroke="#94A3B8" strokeWidth="4"/>
    <!-- Paw base -->
    <ellipse cx="45" cy="90" rx="35" ry="28" fill="#C084FC" stroke="#9333EA" strokeWidth="3"/>
    <!-- Center Pad in pink -->
    <ellipse cx="45" cy="94" rx="16" ry="12" fill="#FBCFE8"/>
    <!-- 4 Toe Pads in pink -->
    <ellipse cx="25" cy="74" rx="6" ry="8" fill="#FBCFE8"/>
    <ellipse cx="38" cy="68" rx="6" ry="9" fill="#FBCFE8"/>
    <ellipse cx="52" cy="68" rx="6" ry="9" fill="#FBCFE8"/>
    <ellipse cx="65" cy="74" rx="6" ry="8" fill="#FBCFE8"/>
  </g>

  <!-- Badge -->
  <rect x="20" y="20" width="240" height="34" rx="17" fill="#E11D48" opacity="0.9"/>
  <text x="140" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#FFF" text-anchor="middle">🦎 Colección Fidget 3D</text>
</svg>
